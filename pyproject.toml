[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "enterprise-applied-data-science-decision-intelligence"
version = "0.1.0"
description = "Cross-industry applied data science and decision intelligence platform: statistics and causal inference, experimentation, recommender systems, mathematical optimisation, customer lifetime value, and product decision science."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Enterprise Applied Data Science & Decision Intelligence Contributors" },
]
keywords = [
  "data-science",
  "causal-inference",
  "experimentation",
  "recommender-systems",
  "optimisation",
  "customer-lifetime-value",
  "decision-science",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "networkx>=3.3,<4",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "ruff>=0.5",
  "statsmodels>=0.14.2,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_intelligence"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true

# SciPy and statsmodels ship without inline type information. Every call into
# them from src/ is wrapped so values are converted to concrete float/ndarray
# types at the boundary; statsmodels is a test-only reference oracle.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true
